<script>
/* =========================================================================
   The Kind Little Farm — panoramic hero banner (3:1)
   Felt-collage & ink illustration drawn entirely with the Canvas 2D API.

   Use:   <canvas id="farm-hero"></canvas>
          <script src="farm-hero.js" defer><\/script>
   Uses the self-hosted Caveat font for the handwritten labels.
   ========================================================================= */
/* =========================================================================
   The Kind Little Farm — felt-collage & ink illustration, drawn entirely
   with the Canvas 2D API. Everything is procedural: felt textures, fuzzy
   cut edges, stitching, wobbly pen lines, watercolour paper.
   ========================================================================= */
(function(){
const CANVAS_ID = 'farm-hero';
const cv = document.getElementById(CANVAS_ID); if (!cv) return;
/* Canvas is a 3:1 panorama (3000 x 1000 units). Scene coordinates are the
   original drawing space; OX / VY shift the scene into the canvas.            */
const W = 3000, H = 1000, GY = 828, TAU = Math.PI * 2;
const OX = 360, VY = 30;                              // scene -> canvas offset
const SX0 = -OX, SX1 = W - OX, SY1 = H + VY;           // visible scene bounds
const dpr = window.devicePixelRatio || 1;
const K = window.__K || Math.max(0.5, Math.min(1.25, Math.max(cv.clientWidth / W, cv.clientHeight / H) * dpr));
cv.width = Math.round(W * K); cv.height = Math.round(H * K);
const ctx = cv.getContext('2d');
ctx.setTransform(K, 0, 0, K, 0, 0);

/* ---------- seeded randomness (stable hand-drawn wobble) ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R = mulberry32(20261115);
const rnd = (a=0,b=1) => a + (b-a)*R();
const hashStr = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const gs = (x,m,s) => Math.exp(-(((x-m)/s)**2));

/* ---------- colour ---------- */
const INK = '#221b16';
function hexRgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,a){const c=hexRgb(h).map(v=>Math.max(0,Math.min(255,Math.round(a>0?v+(255-v)*a:v*(1+a)))));return `rgb(${c[0]},${c[1]},${c[2]})`}

/* ---------- geometry helpers ---------- */
const mid = (a,b) => [(a[0]+b[0])/2,(a[1]+b[1])/2];
function cen(p){let x=0,y=0;for(const q of p){x+=q[0];y+=q[1]}return[x/p.length,y/p.length]}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const[x,y]of p){x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y)}return{x0,y0,x1,y1}}
function densify(pts,step=10,closed=true){const out=[],n=pts.length,m=closed?n:n-1;
  for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);const k=Math.max(1,Math.round(l/step));
    for(let j=0;j<k;j++)out.push([a[0]+(b[0]-a[0])*j/k,a[1]+(b[1]-a[1])*j/k]);}
  if(!closed)out.push(pts[n-1].slice());return out;}
const wobble = (pts,amp) => pts.map(p=>[p[0]+rnd(-amp,amp),p[1]+rnd(-amp,amp)]);
const poly = (pts,step=12,amp=1.1,closed=true) => wobble(densify(pts,step,closed),amp);
const rectP = (x,y,w,h,step=14,amp=1.1) => poly([[x,y],[x+w,y],[x+w,y+h],[x,y+h]],step,amp);
function ellipse(cx,cy,rx,ry,o={}){const n=o.n||44,rough=o.rough??0.03,rot=o.rot||0,ph=rnd(0,TAU),ph2=rnd(0,TAU),pts=[];
  for(let i=0;i<n;i++){const t=i/n*TAU;const k=1+rough*(Math.sin(t*3+ph)*0.6+Math.sin(t*5+ph2)*0.4)+rnd(-rough,rough)*0.3;
    const x=Math.cos(t)*rx*k,y=Math.sin(t)*ry*k;pts.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)]);}
  return pts;}
function ruffle(cx,cy,rx,ry,freq=12,amp=0.08,n=90,flat=null){const pts=[],ph=rnd(0,TAU);
  for(let i=0;i<n;i++){const t=i/n*TAU;const k=1+amp*Math.sin(t*freq+ph)+rnd(-amp,amp)*0.25;let x=cx+Math.cos(t)*rx*k,y=cy+Math.sin(t)*ry*k;if(flat!==null&&y>flat)y=flat;pts.push([x,y]);}
  return pts;}
function arcPts(cx,cy,r,a0,a1,n=18,ry=null){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*(ry??r)])}return p;}
function leafPts(x,y,len,wid,ang,n=14){const L=[],Rr=[];
  for(let i=0;i<=n;i++){const t=i/n,w=wid*0.5*Math.pow(Math.sin(Math.PI*t),0.8);L.push([t*len,-w]);Rr.push([t*len,w]);}
  const pts=L.concat(Rr.reverse().slice(1,-1));
  return pts.map(([px,py])=>[x+px*Math.cos(ang)-py*Math.sin(ang),y+px*Math.sin(ang)+py*Math.cos(ang)]);}
function tube(c,r0,r1){const d=densify(c,6,false),L=[],Rr=[],n=d.length;
  for(let i=0;i<n;i++){const a=d[Math.max(0,i-1)],b=d[Math.min(n-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;const nx=-dy/l,ny=dx/l,r=r0+(r1-r0)*i/(n-1||1);
    L.push([d[i][0]+nx*r,d[i][1]+ny*r]);Rr.push([d[i][0]-nx*r,d[i][1]-ny*r]);}
  return L.concat(Rr.reverse());}
function qbez(p0,p1,p2,n=16){const o=[];for(let i=0;i<=n;i++){const t=i/n,u=1-t;o.push([u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]])}return o;}
function pathOf(pts,closed=true){const p=new Path2D(),n=pts.length;if(n<2)return p;
  if(closed){const m0=mid(pts[n-1],pts[0]);p.moveTo(m0[0],m0[1]);for(let i=0;i<n;i++){const a=pts[i],m=mid(a,pts[(i+1)%n]);p.quadraticCurveTo(a[0],a[1],m[0],m[1]);}p.closePath();}
  else{p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n-1;i++){const m=mid(pts[i],pts[i+1]);p.quadraticCurveTo(pts[i][0],pts[i][1],m[0],m[1]);}p.lineTo(pts[n-1][0],pts[n-1][1]);}
  return p;}

/* ---------- felt ---------- */
const patCache = {};
function feltPat(hex){
  if(patCache[hex]) return patCache[hex];
  const s=180, c=document.createElement('canvas'); c.width=c.height=s; const g=c.getContext('2d'); const r=mulberry32(hashStr(hex));
  g.fillStyle=hex; g.fillRect(0,0,s,s);
  for(let i=0;i<3200;i++){const lt=r()<0.5;g.fillStyle=lt?`rgba(255,255,255,${0.05+r()*0.12})`:`rgba(30,15,0,${0.05+r()*0.10})`;g.fillRect(r()*s,r()*s,0.8+r()*1.6,0.8+r()*1.6);}
  g.lineWidth=0.7;
  for(let i=0;i<650;i++){const x=r()*s,y=r()*s,a=r()*TAU,l=2+r()*7;g.strokeStyle=r()<0.5?'rgba(255,255,255,0.20)':'rgba(30,15,0,0.13)';
    g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+Math.cos(a+1)*l*0.5,y+Math.sin(a+1)*l*0.5,x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  for(let i=0;i<40;i++){g.fillStyle=`rgba(255,255,255,${0.10+r()*0.15})`;g.beginPath();g.arc(r()*s,r()*s,1+r()*2.2,0,TAU);g.fill();}
  return patCache[hex]=ctx.createPattern(c,'repeat');
}
function fuzz(g,pts,hex){const[cx,cy]=cen(pts);g.save();g.lineWidth=0.8;g.strokeStyle=hex;g.globalAlpha=0.75;g.lineCap='round';
  for(const[x,y]of densify(pts,2.6)){const a=Math.atan2(y-cy,x-cx)+rnd(-0.9,0.9),l=rnd(0.4,2.6);g.beginPath();g.moveTo(x-Math.cos(a),y-Math.sin(a));g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke();}
  g.restore();}
function stitch(g,pts,col,inset=7,dash=[6,5],w=1.8){const[cx,cy]=cen(pts);
  const q=pts.map(([x,y])=>{const dx=x-cx,dy=y-cy,l=Math.hypot(dx,dy)||1,f=Math.max(0.15,(l-inset)/l);return[cx+dx*f,cy+dy*f]});
  const p=pathOf(q);g.save();g.setLineDash(dash);g.lineCap='round';g.lineWidth=w;
  g.strokeStyle='rgba(40,20,0,0.28)';g.translate(0.7,1);g.stroke(p);g.translate(-0.7,-1);g.strokeStyle=col;g.stroke(p);g.restore();}
function felt(g,pts,hex,o={}){
  const p=pathOf(pts), sh=o.shadow??1;
  g.save();
  if(sh){g.shadowColor=`rgba(70,42,20,${0.30*Math.min(1,sh+0.15)})`;g.shadowBlur=9*sh*K;g.shadowOffsetX=3*sh*K;g.shadowOffsetY=5*sh*K;}
  g.fillStyle=hex;g.fill(p);g.restore();
  g.save();g.clip(p);g.fillStyle=feltPat(hex);g.fill(p);
  g.translate(-2.5,-3);g.lineWidth=9;g.strokeStyle='rgba(50,25,5,0.10)';g.stroke(p);
  g.translate(5,6);g.lineWidth=7;g.strokeStyle='rgba(255,255,255,0.15)';g.stroke(p);
  g.restore();
  fuzz(g,pts,hex);
  if(o.stitch) stitch(g,pts,o.stitch,o.inset||7);
  if(o.outline) ink(g,pts.map(q=>[q[0]+o.outline[0],q[1]+o.outline[1]]),{closed:true,w:o.ow||1.8,rough:0.6});
  return p;
}
function dotsIn(g,pts,col,sp,rmin,rmax,alpha=0.9){const p=pathOf(pts),b=bbox(pts);g.save();g.clip(p);g.fillStyle=col;g.globalAlpha=alpha;
  for(let y=b.y0;y<b.y1;y+=sp)for(let x=b.x0+((y/sp)%2?sp/2:0);x<b.x1;x+=sp){const r=rnd(rmin,rmax);g.beginPath();g.ellipse(x+rnd(-sp*.25,sp*.25),y+rnd(-sp*.25,sp*.25),r,r*rnd(0.8,1.1),rnd(0,3),0,TAU);g.fill();}
  g.restore();}

/* ---------- ink & watercolour ---------- */
function ink(g,pts,o={}){
  const w=o.w||2.1, closed=!!o.closed, amp=o.rough??0.8, ph=rnd(0,100);
  let d=densify(pts,o.step||6,closed);
  d=d.map((p,i)=>[p[0]+Math.sin(i*0.35+ph)*amp*0.6+rnd(-amp,amp)*0.3,p[1]+Math.cos(i*0.29+ph)*amp*0.6+rnd(-amp,amp)*0.3]);
  const p=pathOf(d,closed);
  g.save();g.lineCap='round';g.lineJoin='round';g.strokeStyle=o.color||INK;g.lineWidth=w;g.globalAlpha=o.alpha??0.9;g.stroke(p);
  if(o.double!==false){g.globalAlpha=(o.alpha??0.9)*0.25;g.lineWidth=w*0.55;g.translate(rnd(-1.1,1.1),rnd(-1.1,1.1));g.stroke(p);}
  g.restore();
}
const line = (g,x1,y1,x2,y2,o={}) => ink(g,[[x1,y1],[x2,y2]],o);
function wash(g,pts,hex,a=0.16){g.save();g.globalCompositeOperation='multiply';
  for(let k=0;k<4;k++){g.globalAlpha=a;g.fillStyle=hex;g.fill(pathOf(pts.map(p=>[p[0]+rnd(-3,3),p[1]+rnd(-3,3)])));}
  g.globalAlpha=a*1.3;g.strokeStyle=hex;g.lineWidth=1.4;g.stroke(pathOf(pts));g.restore();}
function label(g,txt,x,y,size=30,rot=0,col=INK,weight=600){g.save();g.translate(x,y);g.rotate(rot);g.font=`${weight} ${size}px Caveat, 'Comic Sans MS', cursive`;
  g.fillStyle=col;g.globalAlpha=0.9;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,0);g.restore();}
function arrow(g,pts,o={}){ink(g,pts,{w:1.6,rough:0.5,...o});const n=pts.length,a=Math.atan2(pts[n-1][1]-pts[n-2][1],pts[n-1][0]-pts[n-2][0]),[x,y]=pts[n-1];
  for(const s of[-0.5,0.5])line(g,x,y,x-Math.cos(a+s)*11,y-Math.sin(a+s)*11,{w:1.6,rough:0.3,double:false});}
function makeLayer(w=W,h=H){const c=document.createElement('canvas');c.width=w*K;c.height=h*K;const g=c.getContext('2d');g.scale(K,K);return{c,g,w,h};}
function makeSprite(w,h,fn){const L=makeLayer(w,h);fn(L.g);return L;}

/* =========================================================================
   LAYER A — paper, sky things, hills, turbine towers
   ========================================================================= */
function paper(g){
  g.fillStyle='#e6e4de';g.fillRect(0,0,W,H);
  // soft grey sky, a touch cooler at the top
  const sky=g.createLinearGradient(0,0,0,GY-VY);sky.addColorStop(0,'#a9cce1');sky.addColorStop(0.55,'#c8dfea');sky.addColorStop(1,'#e2edee');
  g.fillStyle=sky;g.fillRect(0,0,W,GY-VY+20);
  // watercolour mottling (multiply blooms)
  g.save();g.globalCompositeOperation='multiply';
  for(let i=0;i<460;i++){const x=rnd(-100,W+100),y=rnd(-80,GY+60),r=rnd(40,180),c=R()<0.65?'105,140,170':'160,158,150',a=rnd(0.02,0.07);
    const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(${c},${a})`);gr.addColorStop(0.75,`rgba(${c},${a*0.5})`);gr.addColorStop(1,`rgba(${c},0)`);
    g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  // dried-edge 'backruns'
  for(let i=0;i<60;i++){const pts=ellipse(rnd(0,W),rnd(0,GY),rnd(30,130),rnd(18,70),{rough:0.25,n:30});
    g.strokeStyle=`rgba(105,114,122,${rnd(0.03,0.06)})`;g.lineWidth=rnd(1,2.6);g.stroke(pathOf(pts));}
  g.restore();
  // lifted (lighter) patches
  for(let i=0;i<120;i++){const x=rnd(0,W),y=rnd(0,GY),r=rnd(20,80);const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,'rgba(255,255,255,0.10)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);}
  // recycled-paper flecks
  for(let i=0;i<1200;i++){g.fillStyle=`rgba(60,52,44,${rnd(0.08,0.22)})`;g.beginPath();g.ellipse(rnd(0,W),rnd(0,H),rnd(0.4,1.4),rnd(0.3,0.9),rnd(0,3),0,TAU);g.fill();}
  // cold-press bumps

     g.fillStyle=['#fbf6e8','#f3d35a','#eaa5ab','#5f7d3e'][i%4];g.beginPath();g.arc(x,y,rnd(1.3,2.4),0,TAU);g.fill();}
   for(let i=0;i<70;i++){const x=rnd(SX0,770),th=GY-topL(x);if(th<20)continue;const y=GY-th*rnd(0.15,0.8);

   for(const[x,s]of[[-250,0.8],[-190,0.95],[46,1],[112,0.85],[560,0.7]]){const yb=topL(x)+6;

/* paths that carry the animated water / nutrient / sugar flow */
const ROOTS=[], HYPHAE=[];
function mkPath(pts,w){const cum=[0];for(let i=1;i<pts.length;i++)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,w,cum,len:cum[cum.length-1]};}
function at(p,u){const s=Math.max(0,Math.min(1,u))*p.len,c=p.cum;let lo=0,hi=c.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(c[m]<=s)lo=m;else hi=m;}
  const t=(s-c[lo])/((c[hi]-c[lo])||1),a=p.pts[lo],b=p.pts[hi];return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function rootSys(g,x,y,n,len,w,spread=0.55){for(let i=0;i<n;i++){const a=Math.PI/2+(i-(n-1)/2)*spread/(Math.max(1,n-1)/2||1)+rnd(-0.1,0.1);root(g,x+rnd(-4,4),y,a,len*rnd(0.75,1.1),w,3);}}
function root(g,x,y,ang,len,w,depth){
  if(depth<=0||len<8)return;const pts=[[x,y]];let cx=x,cy=y,a=ang;const seg=6,n=Math.ceil(len/seg);
  for(let i=0;i<n;i++){a+=rnd(-0.22,0.22)+(Math.PI/2-a)*0.03;cx+=Math.cos(a)*seg;cy+=Math.sin(a)*seg;if(cy>SY1-8)break;pts.push([cx,cy]);
    if(R()<0.13&&depth>1&&i>1)root(g,cx,cy,a+(R()<0.5?-1:1)*rnd(0.5,1.1),len*0.45*(1-i/n),Math.max(0.7,w*0.6),depth-1);}
  if(pts.length>1){ink(g,pts,{w,color:'#2c1a10',rough:0.25,double:false,alpha:0.85});if(w>=1)ROOTS.push(mkPath(pts,w));}
  // root hairs
  for(let i=1;i<pts.length;i+=2){const[px,py]=pts[i];const b=rnd(0,TAU);line(g,px,py,px+Math.cos(b)*rnd(3,6),py+Math.sin(b)*rnd(3,6),{w:0.6,color:'#f2e2c2',alpha:0.5,rough:0.1,double:false});}
}
function hyphae(g){
  // fine fungal threads: wandering walks that start on roots, branch and spread through the soil
  g.save();
  const walk=(x,y,a,len,w,depth)=>{const pts=[[x,y]];for(let i=0;i<len;i++){a+=rnd(-0.45,0.45);x+=Math.cos(a)*5;y+=Math.sin(a)*5;
      if(y<GY+34)a=rnd(0.4,2.7);if(y>SY1-16)a=-rnd(0.4,2.7);if(x<SX0+30||x>SX1-30)a=Math.PI-a;pts.push([x,y]);
      if(depth>0&&R()<0.07)walk(x,y,a+(R()<0.5?-1:1)*rnd(0.6,1.2),Math.floor(len*0.4),w*0.8,depth-1);}
    ink(g,pts,{w,color:'#fbf3df',rough:0.35,alpha:0.62,double:false,step:4});
    const[ex,ey]=pts[pts.length-1];g.fillStyle='#fff7e6';g.globalAlpha=0.85;g.beginPath();g.arc(ex,ey,rnd(1.4,2.4),0,TAU);g.fill();g.globalAlpha=1;
    if(pts.length>8)HYPHAE.push(mkPath(pts,w));};
  const anchors=ROOTS.filter(r=>r.len>30&&r.pts[0][0]>380);
  for(let i=0;i<40;i++){const r=anchors[Math.floor(rnd(0,anchors.length))];const p=r.pts[Math.floor(rnd(r.pts.length*0.3,r.pts.length))];
    walk(p[0],p[1],rnd(0,TAU),Math.floor(rnd(32,72)),rnd(0.75,1.05),2);}
  for(let i=0;i<12;i++)walk(rnd(1000,1500),rnd(GY+50,SY1-40),rnd(0,TAU),Math.floor(rnd(30,60)),rnd(0.7,1),2);
  for(let i=0;i<8;i++)walk(rnd(1900,2600),rnd(GY+50,SY1-40),rnd(0,TAU),Math.floor(rnd(30,60)),rnd(0.7,1),2);
  for(let i=0;i<5;i++)walk(rnd(-320,260),rnd(GY+50,SY1-40),rnd(0,TAU),Math.floor(rnd(30,55)),rnd(0.7,1),2);
  g.restore();
}

    if(h.chicks)for(let i=0;i<h.chicks;i++){const cx=s.x-s.dir*(56+i*24)+6*Math.sin(t*1.3+i),hop=Math.abs(Math.sin(t*7+i*1.7))*4;
      ctx.save();ctx.translate(cx,GY-hop);ctx.scale(s.dir,1);ctx.drawImage(chickSpr.c,-22,-36,48,42);ctx.restore();}
    const bob=s.walking?-Math.abs(Math.sin(t*8+h.ph*10))*2:0;
    ctx.save();ctx.translate(s.x,GY+bob);ctx.scale(s.dir,1);ctx.rotate(0.12*s.peck);
    ctx.drawImage(sp.body.c,-85,-130,150,145);
    ctx.translate(27+6*s.peck,-66+26*s.peck);ctx.rotate(0.85*s.peck+(s.walking?0.07*Math.sin(t*8):0));
    ctx.drawImage(sp.head.c,-30,-62,96,86);ctx.restore();}
}
function pondLife(t){
  const wx=-205+52*Math.sin(t*0.12),dir=Math.cos(t*0.12)>=0?1:-1,bob=1.4*Math.sin(t*2.2);
  ctx.save();ctx.strokeStyle='#eef7fa';ctx.lineWidth=1.3;
  for(let i=0;i<3;i++){const p=(t*0.45+i/3)%1;ctx.globalAlpha=(1-p)*0.7;ctx.beginPath();ctx.ellipse(wx-dir*8,GY+8,14+38*p,(14+38*p)*0.2,0,0,TAU);ctx.stroke();}
  ctx.restore();
  ctx.save();ctx.translate(wx,GY+7+bob);ctx.scale(dir,1);ctx.rotate(0.03*Math.sin(t*2.2));ctx.drawImage(duckSpr.c,-44,-54,96,72);ctx.restore();
}
function dragonfly(t){
  const x=-205+150*Math.sin(t*0.37)+24*Math.sin(t*1.9),y=GY-140+34*Math.sin(t*0.61)+10*Math.sin(t*2.3);
  const vx=150*0.37*Math.cos(t*0.37)+24*1.9*Math.cos(t*1.9);
  ctx.save();ctx.translate(x,y);ctx.scale(vx>=0?1:-1,1);
  const f=0.6+0.4*Math.abs(Math.sin(t*38));
  ctx.fillStyle='rgba(235,246,250,0.65)';ctx.strokeStyle=INK;ctx.lineWidth=0.8;
  for(const[dx,a]of[[2,-0.35],[2,0.35],[-3,-0.55],[-3,0.55]]){ctx.save();ctx.translate(dx,0);ctx.rotate(a<0?-Math.PI/2-a*0.4:Math.PI/2-a*0.4);
    ctx.beginPath();ctx.ellipse(10*f,0,11*f,3.4,0,0,TAU);ctx.fill();ctx.stroke();ctx.restore();}
  ctx.strokeStyle='#2f7f88';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-22,1);ctx.lineTo(6,0);ctx.stroke();
  ctx.fillStyle='#2f7f88';ctx.beginPath();ctx.arc(9,0,3.6,0,TAU);ctx.fill();
  ctx.strokeStyle=INK;ctx.lineWidth=0.8;for(let i=-18;i<2;i+=5){ctx.beginPath();ctx.moveTo(i,-1.6);ctx.lineTo(i,1.6);ctx.stroke();}
  ctx.restore();
}
const LADY=[[[462,GY-34],[490,GY-46]],[[596,GY-60],[630,GY-64]],[[834,GY-205],[834,GY-250]],[[1641,GY-250],[1642,GY-320]],
            [[2424,GY-120],[2430,GY-170]],[[2556,GY-112],[2590,GY-128]],[[-100,GY-50],[-102,GY-96]],[[996,GY-40],[994,GY-100]]];
function ladybugs(t){
  LADY.forEach(([a,b],i)=>{const w=0.32+0.08*(i%3),ph=i*1.7,u=0.5+0.5*Math.sin(t*w+ph),v=Math.cos(t*w+ph);
    const x=a[0]+(b[0]-a[0])*u,y=a[1]+(b[1]-a[1])*u;let ang=Math.atan2(b[1]-a[1],b[0]-a[0]);if(v<0)ang+=Math.PI;
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);
    ctx.strokeStyle=INK;ctx.lineWidth=0.9;
    for(const s of[-1,1])for(let k=-1;k<=1;k++){const wig=Math.sin(t*16+k*2+s)*1.3;ctx.beginPath();ctx.moveTo(k*3.2,s*4);ctx.lineTo(k*3.2+wig,s*8);ctx.stroke();}
    ctx.fillStyle=INK;ctx.beginPath();ctx.arc(6.5,0,3.6,0,TAU);ctx.fill();
    ctx.fillStyle='#fff';for(const s of[-1,1]){ctx.beginPath();ctx.arc(8.2,s*1.6,0.9,0,TAU);ctx.fill();}
    ctx.fillStyle='#d8382c';ctx.beginPath();ctx.ellipse(-0.5,0,7.4,6.4,0,0,TAU);ctx.fill();ctx.lineWidth=1.1;ctx.stroke();
    ctx.beginPath();ctx.moveTo(-7.5,0);ctx.lineTo(5.5,0);ctx.stroke();
    ctx.fillStyle=INK;for(const[dx,dy]of[[-3.6,-3],[-3.6,3],[1.6,-3.4],[1.6,3.4],[-6,0]]){ctx.beginPath();ctx.arc(dx,dy,1.35,0,TAU);ctx.fill();}
    ctx.strokeStyle='rgba(255,255,255,0.7)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(-1,-1.5,3.6,3.6,4.6);ctx.stroke();
    ctx.restore();});
}

/* =========================================================================
   Frame + loop
   ========================================================================= */
let layerA, layerB, layerC;
const CLOUDS=[[0,345,40,1,0.13,0],[1,1210,58,1,0.11,2],[2,2010,46,1,0.09,4],[1,-280,104,0.9,0.12,1],[0,2470,150,0.7,0.1,3]];
function frame(t){
  ctx.setTransform(K,0,0,K,0,0);
  ctx.drawImage(layerA.c,0,0,W,H);
  ctx.save();ctx.translate(OX,-VY);
  ctx.save();ctx.translate(760,150);ctx.rotate(0.07*Math.sin(t*0.5));const sc=1+0.015*Math.sin(t*1.3);ctx.scale(sc,sc);ctx.drawImage(sunSpr.c,-150,-150,300,300);ctx.restore();
  for(const[i,x,y,s,w,p]of CLOUDS){const c=cloudSprs[i];ctx.drawImage(c.c,x+28*Math.sin(t*w+p),y,c.w*s,c.h*s);}
  for(const[T,spd,off]of TURBINES){const s=bladeSprs[T.r];
    for(let i=0;i<3;i++){ctx.save();ctx.translate(T.x,T.y);ctx.rotate(t*spd+i*TAU/3+off);
      ctx.shadowColor='rgba(70,42,20,0.22)';ctx.shadowBlur=6*K;ctx.shadowOffsetX=3*K;ctx.shadowOffsetY=4*K;
      ctx.drawImage(s.c,-24,-(T.r+12),48,T.r+24);ctx.restore();}
    const hs=T.r<80?0.8:1;ctx.drawImage(hubSpr.c,T.x-18*hs,T.y-18*hs,36*hs,36*hs);}
  ctx.restore();
  ctx.drawImage(layerB.c,0,0,W,H);
  ctx.save();ctx.translate(OX,-VY);
  flows(t);worms(t);pondLife(t);hens(t);ladybugs(t);
  ctx.restore();
  ctx.drawImage(layerC.c,0,0,W,H);
  ctx.save();ctx.translate(OX,-VY);
  drops(t);bees(t);butterflies(t);dragonfly(t);
  ctx.restore();
}

async function start(){
  try{await Promise.race([Promise.all([document.fonts.load('700 34px Caveat'),document.fonts.load('600 30px Caveat')]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  layerA=buildLayerA();buildSprites();buildCritters();layerB=buildLayerB();layerC=buildLayerC();setupFlows();
  if(window.__T!==undefined){frame(window.__T);window.__done=true;return;}
  const motion=window.matchMedia('(prefers-reduced-motion: reduce)');
  const control=document.getElementById('farm-play');
  let visible=true,playing=!motion.matches,last=null,lastDraw=0,tt=4.2,raf=0;
  function sync(){
    control.dataset.playing=String(playing);
    const label=playing?'Pause farm animation':'Play farm animation';
    control.setAttribute('aria-label',label);control.title=label;
  }
  function schedule(){if(playing&&visible&&!document.hidden&&!raf)raf=requestAnimationFrame(loop);}
  function loop(now){
    raf=0;
    if(!playing||!visible||document.hidden){last=null;return;}
    if(!lastDraw||now-lastDraw>=1000/30){
      if(last!==null){tt+=Math.min(0.1,(now-last)/1000);frame(tt);}
      last=now;lastDraw=now;
    }
    schedule();
  }
  function activity(){last=null;lastDraw=0;if(document.hidden||!visible||!playing){cancelAnimationFrame(raf);raf=0;}else schedule();}
  control.addEventListener('click',()=>{playing=!playing;sync();activity();});
  document.addEventListener('visibilitychange',activity);
  if('IntersectionObserver' in window)new IntersectionObserver(es=>{visible=es[0].isIntersecting;activity();},{threshold:0}).observe(cv);
  if(motion.addEventListener)motion.addEventListener('change',e=>{if(e.matches){playing=false;sync();activity();}});
  frame(tt);sync();schedule();
}
start();
})();

<script>
/* Grey felt background — two generated layers: a fine seamless wool tile, and a larger soft
   'pressed wool' cloud layer with a different repeat size, so no grid pattern shows. */
(function(){
  let a=20261115; const r=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  function tile(S,draw){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');
    // draw at (x,y) and at wrapped positions when touching an edge, so the tile repeats seamlessly
    const tiled=(x,y,m,fn)=>{for(const dx of[-S,0,S])for(const dy of[-S,0,S]){const X=x+dx,Y=y+dy;if(X>-m&&X<S+m&&Y>-m&&Y<S+m)fn(X,Y);}};
    draw(g,S,tiled);return c.toDataURL('image/png');}
  // 1) fine wool: specks, curly fibres, bobbles (on transparent so the cloud layer shows through)
  const wool=tile(768,(g,S,tiled)=>{
    for(let i=0;i<26000;i++){const x=r()*S,y=r()*S,l=r()<0.5,sz=0.8+r()*1.6,col=l?`rgba(255,255,255,${0.06+r()*0.14})`:`rgba(30,30,30,${0.05+r()*0.10})`;
      tiled(x,y,3,(X,Y)=>{g.fillStyle=col;g.fillRect(X,Y,sz,sz);});}
    g.lineCap='round';
    for(let i=0;i<12000;i++){const x=r()*S,y=r()*S,ang=r()*6.283,len=4+r()*18,bend=(r()-0.5)*1.8,w=0.5+r()*1.0,k=r();
      const col=k<0.47?`rgba(255,255,255,${0.14+r()*0.22})`:k<0.93?`rgba(45,45,45,${0.08+r()*0.14})`:k<0.97?`rgba(165,130,95,${0.3+r()*0.2})`:`rgba(105,140,175,${0.3+r()*0.2})`;
      tiled(x,y,len+2,(X,Y)=>{g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(X,Y);
        g.quadraticCurveTo(X+Math.cos(ang+bend)*len*0.5,Y+Math.sin(ang+bend)*len*0.5,X+Math.cos(ang)*len,Y+Math.sin(ang)*len);g.stroke();});}
    for(let i=0;i<160;i++){const x=r()*S,y=r()*S,rad=1+r()*2.4,l=r()<0.6;
      tiled(x,y,4,(X,Y)=>{g.fillStyle=l?'rgba(242,242,238,0.38)':'rgba(60,60,58,0.26)';g.beginPath();g.arc(X,Y,rad,0,6.283);g.fill();});}
  });
  // 2) soft density changes, like pressed wool (gentle, large, different repeat size)
  const clouds=tile(700,(g,S,tiled)=>{
    for(let i=0;i<120;i++){const x=r()*S,y=r()*S,rad=25+r()*90,dark=r()<0.5,al=0.025+r()*0.035;
      tiled(x,y,rad,(X,Y)=>{const gr=g.createRadialGradient(X,Y,0,X,Y,rad);gr.addColorStop(0,dark?`rgba(70,72,70,${al})`:`rgba(255,255,255,${al*1.2})`);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(X-rad,Y-rad,rad*2,rad*2);});}
  });
  const b=document.body.style;
  b.setProperty('--felt-wool',`url(${wool})`);
  b.backgroundImage=`url(${wool}), url(${clouds})`;
  b.backgroundSize='384px 384px, 910px 910px';
  b.backgroundRepeat='repeat, repeat';
})();
</script>
